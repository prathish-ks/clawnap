<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="clawnap">
  <!-- a claw at rest, holding the night: hibernate idle cells, wake on the first message -->
  <rect width="512" height="512" rx="112" fill="#0B1220"/>
  <!-- the claw: a thick C with two pincers curling inward -->
  <path d="M 338 150 A 150 150 0 1 0 338 394" fill="none" stroke="#F97316" stroke-width="70" stroke-linecap="round"/>
  <path d="M 338 150 L 384 198" fill="none" stroke="#F97316" stroke-width="56" stroke-linecap="round"/>
  <path d="M 338 394 L 384 346" fill="none" stroke="#F97316" stroke-width="56" stroke-linecap="round"/>
  <!-- the moon in its grip -->
  <circle cx="392" cy="272" r="50" fill="#FDE68A"/>
  <circle cx="412" cy="254" r="44" fill="#0B1220"/>
</svg>
