name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./experiments 2>/dev/null)" || { gofmt -l ./cmd ./internal ./experiments; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build clawnap (linux/${{ matrix.goarch }})
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o clawnap-linux-${{ matrix.goarch }} ./cmd/clawnap
      - uses: actions/upload-artifact@v6
        with:
          name: clawnap-linux-${{ matrix.goarch }}
          path: clawnap-linux-${{ matrix.goarch }}
